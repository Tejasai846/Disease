<!DOCTYPE html>
<html>
<head>
    <title>Disease Diagnosis System</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2, #89f7fe);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* MAIN CONTAINER */
        .main {
            width: 90%;
            max-width: 1100px;
            padding: 25px;
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        /* 🍏 GLASS EFFECT */
        .glass {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.25),
                inset 0 1px 1px rgba(255,255,255,0.4);
            position: relative;
            overflow: hidden;
            transition: 0.4s;
        }

        /* ✨ LIGHT REFLECTION */
        .glass::before {
            content: "";
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 100%;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,0.25),
                transparent
            );
            transform: rotate(25deg);
            pointer-events: none;
        }

        .glass:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.3),
                inset 0 1px 1px rgba(255,255,255,0.5);
        }

        .left {
            flex: 2;
            height: 450px;
            overflow-y: auto;
            padding: 15px;
        }

        .right {
            flex: 1;
            padding: 20px;
        }

        /* 🔍 SEARCH */
        .search-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        #searchBox {
            width: 100%;
            padding: 12px 40px;
            border-radius: 20px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.6);
            transition: 0.3s;
        }

        #searchBox:focus {
            background: white;
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

        .search-wrapper::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* SYMPTOMS */
        .symptom-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 6px 0;
            border-radius: 12px;
            color: white;
            transition: 0.25s;
        }

        .symptom-item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(5px);
        }

        input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
            accent-color: #00ffcc;
        }

        /* TEXTAREA */
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 15px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.6);
        }

        textarea:focus {
            background: white;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        /* BUTTON */
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* RESULT */
        h3 {
            text-align: center;
            margin-top: 15px;
            color: white;
        }

        /* SCROLLBAR */
        .left::-webkit-scrollbar {
            width: 6px;
        }

        .left::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
        }

    </style>
</head>

<body>

<div class="main">

<h2>🧠 Disease Diagnosis System</h2>

<form action="/predict" method="post">

<div class="container">

    <!-- LEFT -->
    <div class="glass left">

        <div class="search-wrapper">
            <input type="text" id="searchBox" placeholder="Search symptoms...">
        </div>

        <div id="symptomList">
            {% for symptom in symptoms %}
                <label class="symptom-item">
                    <input type="checkbox" name="{{ symptom }}">
                    {{ symptom }}
                </label>
            {% endfor %}
        </div>

    </div>

    <!-- RIGHT -->
    <div class="glass right">
        <h3 style="margin-bottom:10px;">Extra Symptoms</h3>

        <textarea name="extra_symptoms" rows="5"
        placeholder="e.g fever, headache"></textarea>

        <button type="submit">Predict</button>
    </div>

</div>

</form>

<div style="background-color: rgba(255, 255, 255, 0.2); padding: 15px; margin-top: 10px; border-radius: 50px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h3 style="color: rgb(89, 255, 0); font-weight: bold; margin: 0;">
        {{ prediction_text }}
    </h3>
</div>

</div>

<!-- 🔍 SEARCH SCRIPT -->
<script>
document.getElementById("searchBox").addEventListener("keyup", function() {
    let filter = this.value.toLowerCase();
    let items = document.querySelectorAll(".symptom-item");

    items.forEach(function(item) {
        let text = item.textContent.toLowerCase();
        item.style.display = text.includes(filter) ? "" : "none";
    });
});
</script>

</body>
</html>
